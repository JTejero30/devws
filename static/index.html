<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>devws · multi-repo workspaces</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
--green:#3fb950; --red:#f85149; --yellow:#d29922; --accent:#58a6ff; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.5 -apple-system,"SF Pro",Menlo,monospace; background:var(--bg); color:var(--fg); }
header { display:flex; align-items:center; gap:16px; padding:10px 20px; border-bottom:1px solid var(--border); }
header h1 { font-size:15px; margin:0; }
header .sub { color:var(--dim); font-size:12px; }
main { display:flex; flex-direction:column; gap:16px; padding:16px 20px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; }
.card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; }
.row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #21262d; flex-wrap:wrap; }
.row:last-child { border-bottom:none; }
.name { width:210px; font-weight:600; }
.badge { font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid var(--border); color:var(--dim); }
.badge.dirty { color:var(--yellow); border-color:var(--yellow); }
.badge.up { color:var(--green); border-color:var(--green); }
.badge.down { color:var(--dim); }
.badge.starting { color:var(--yellow); border-color:var(--yellow); }
.badge.external { color:var(--accent); border-color:var(--accent); }
select { background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:6px;
padding:4px 8px; font:inherit; flex:1; min-width:150px; }
button { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px;
padding:4px 12px; font:inherit; cursor:pointer; white-space:nowrap; }
button:hover { border-color:var(--accent); }
button.primary { background:#1f6feb; border-color:#1f6feb; }
button.danger:hover { border-color:var(--red); color:var(--red); }
button:disabled { opacity:.4; cursor:default; }
.log { background:#010409; border:1px solid var(--border); border-radius:6px; padding:8px;
font-size:11px; height:180px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
color:#7ee787; margin-top:6px; display:none; }
.port { color:var(--dim); font-size:12px; min-width:64px; }
.profiles-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.p-card { border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#0d1117; }
.p-card h3 { margin:0 0 4px; font-size:14px; }
.p-card .meta { color:var(--dim); font-size:11px; margin-bottom:8px; }
.p-repo { display:flex; gap:8px; font-size:12px; padding:2px 0; }
.p-repo .pn { width:200px; color:var(--dim); }
.p-repo .pb { font-weight:600; }
.p-svcs { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.p-svcs .badge { font-size:11px; }
.p-svc { display:flex; gap:8px; align-items:center; font-size:12px; padding:2px 0; }
.p-svc .pn { width:150px; color:var(--dim); }
.p-actions { display:flex; gap:8px; margin-top:10px; }
.p-form { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:12px; }
.p-form .row { align-items:center; }
.p-form label { width:200px; color:var(--dim); font-size:12px; }
.p-form input[type=text] { background:#161b22; color:var(--fg); border:1px solid var(--border);
border-radius:6px; padding:4px 8px; font:inherit; width:220px; }
#toast { position:fixed; bottom:20px; right:20px; background:#21262d; border:1px solid var(--border);
border-radius:8px; padding:10px 16px; max-width:480px; font-size:13px; display:none; z-index:9; }
#logModal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:20;
align-items:center; justify-content:center; }
#logModal .modal { background:var(--panel); border:1px solid var(--border); border-radius:10px;
width:min(960px, 92vw); height:min(700px, 85vh); display:flex; flex-direction:column;
padding:14px 16px; }
#logModal.full .modal { width:100vw; height:100vh; border-radius:0; border:none; padding:10px 12px; }
#logModal h2 { font-size:14px; margin:0 0 10px; }
.ln-svc { color:#d2a8ff; font-weight:600; margin-right:8px; display:inline-block; min-width:92px; }
#allGrid { flex:1; display:grid; gap:10px; min-height:0;
grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); }
.all-panel { display:flex; flex-direction:column; min-height:0; min-width:0;
background:#010409; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.all-panel .ph { display:flex; align-items:center; gap:8px; padding:6px 10px;
background:#161b22; border-bottom:1px solid var(--border);
font-size:12px; font-weight:600; }
.all-panel .ph .st { margin-left:auto; font-weight:400; font-size:11px; }
.st.up { color:#7ee787; }
.st.starting { color:#d29922; }
.st.down, .st.external { color:#8b949e; }
.all-panel pre { flex:1; margin:0; padding:8px 10px; overflow-y:auto; white-space:pre-wrap;
word-break:break-all; font-size:11px; color:#c9d1d9; }
.log-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.log-tabs button.active { background:#1f6feb; border-color:#1f6feb; }
.log-tabs button.muted { opacity:.5; }
#modalLog { background:#010409; border:1px solid var(--border); border-radius:6px; padding:10px;
font-size:12px; flex:1; overflow-y:auto; white-space:pre-wrap; word-break:break-all; color:#c9d1d9; }
.ln-err { color:#ff7b72; }
.ln-warn { color:#d29922; }
.ln-debug { color:#8b949e; }
.ln-info { color:#58a6ff; }
.log .ln-err, #logs .ln-err { color:#ff7b72; }
.log .ln-warn { color:#d29922; }
.log .ln-debug { color:#8b949e; }
#toast.err { border-color:var(--red); }
.wide { grid-column:1 / -1; }
.badge.wt { color:#d2a8ff; border-color:#d2a8ff44; }
</style>
</head>
<body>
<header>
<h1>devws</h1>
<span class="sub">perfiles de trabajo · un solo perfil arrancado a la vez · puertos basicos</span>
</header>
<main>
<div class="card">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
<h2 style="margin:0">Repositorios</h2>
<button onclick="openRepoForm()" title="añade el repo a la config: entrará en los perfiles/worktrees al guardarlos">+ añadir repo</button>
</div>
<div id="repoForm" style="display:none;margin:8px 0 10px;border:1px solid var(--border);border-radius:6px;padding:8px">
<div class="row"><label>Nombre</label><input type="text" id="repoName" placeholder="ej: mi-nuevo-repo"></div>
<div class="row"><label>Path</label><input type="text" id="repoPath" placeholder="relativo a ~/proyectos, ej: mi-nuevo-repo o ../commons/otro" style="width:330px"></div>
<div class="row"><label>Kind</label><select id="repoKind" style="flex:0 1 110px"><option value="python">python</option><option value="npm">npm</option></select></div>
<div class="p-actions">
<button class="primary" onclick="saveRepo()">Añadir</button>
<button onclick="closeRepoForm()">Cancelar</button>
</div>
</div>
<div id="repos"></div>
</div>
<div class="card wide">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
<h2 style="margin:0">Perfiles de trabajo</h2>
<button class="primary" onclick="newProfile()">+ Nuevo perfil</button>
</div>
<div id="orphans" style="display:none;margin-bottom:10px"></div>
<div class="profiles-grid">
<div id="profilesList"><span style="color:var(--dim)">Sin perfiles. Crea uno a la derecha.</span></div>
<div class="p-form" id="profileForm" style="display:none">
<h3 id="formTitle" style="margin:0 0 10px;font-size:13px">Nuevo perfil</h3>
<div class="row"><label>Nombre</label><input type="text" id="pfName" placeholder="ej: mi-feature"></div>
<div id="pfRepos"></div>
<div id="pfServices" style="margin-top:8px"></div>
<label style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px">
<input type="checkbox" id="pfWorktree"> Perfil worktree (repos aislados en git worktrees; mismos puertos basicos; no toca los repos originales)
</label>
<div class="p-actions">
<button class="primary" onclick="saveProfile()">Guardar</button>
<button onclick="closeProfileForm()">Cancelar</button>
</div>
</div>
</div>
</div>
</main>
<div id="logModal" onclick="if(event.target===this) closeLogs()">
<div class="modal">
<div style="display:flex;align-items:center;gap:12px">
<h2 id="logModalTitle">Logs</h2>
<span style="flex:1"></span>
<button onclick="closeLogs()">✕ cerrar</button>
</div>
<div class="log-tabs" id="logTabs"></div>
<pre id="modalLog"></pre>
<div id="allGrid" style="display:none"></div>
</div>
</div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function _lineClass(t) {
if (/\bdebug\b/i.test(t)) return "ln-debug";
if (/error|critical|traceback|exception|errno 48|failed to load|refused/i.test(t)) return "ln-err";
if (/warning|warn\b/i.test(t)) return "ln-warn";
if (/^\s*info\b/i.test(t)) return "ln-info";
return "";
}
function colorizeLog(lines) {
return lines.map(l => {
const t = l.replace(/\u001b\[[0-9;]*m/g, "");
return `<span class="${_lineClass(t)}">${esc(t)}</span>`;
}).join("\n");
}
function colorizeAll(events) {
return events.map(e => {
const t = e.line.replace(/\u001b\[[0-9;]*m/g, "").replace(/\n$/, "");
return `<span class="${_lineClass(t)}"><span class="ln-svc">${esc(e.svc)}</span> ${esc(t)}</span>`;
}).join("\n");
}
const _stick = new WeakMap();
function stickyScroll(el, force) {
if (force || _stick.get(el) !== false) el.scrollTop = el.scrollHeight;
}
function _isLogEl(el) {
return el && el.id && (el.id === "modalLog" || el.id.startsWith("all-") || el.id.startsWith("log-"));
}
document.addEventListener("wheel", e => {
let el = e.target;
while (el && el !== document && !_isLogEl(el)) el = el.parentElement;
if (!_isLogEl(el)) return;
if (e.deltaY < 0) _stick.set(el, false);
else if (el.scrollHeight - el.scrollTop - el.clientHeight < 40) _stick.set(el, true);
}, true);

async function api(path, opts) {
const r = await fetch(path, opts);
const j = await r.json();
if (!r.ok) throw new Error(j.detail || j.msg || JSON.stringify(j));
return j;
}
function toast(msg, err) {
const t = $("#toast");
t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 6000);
}

let repos = [], services = [];
let wtState = {};
let enabled = null;
function enabledSet() {
if (enabled === null) {
const saved = JSON.parse(localStorage.getItem("devws_enabled") || "null");
enabled = new Set(saved || services.map(s => s.name));
}
return enabled;
}
function setEnabled(name, on) {
const s = enabledSet(); on ? s.add(name) : s.delete(name);
localStorage.setItem("devws_enabled", JSON.stringify([...s]));
}

let activeProfile = null;

async function refresh() {
try {
const [r, st] = await Promise.all([api("/api/repos"), api("/api/state")]);
repos = r; services = st.services; activeProfile = st.active_profile || null;
wtState = st.worktrees || {};
} catch (e) { toast("error de conexión al server devws: " + e.message, true); return; }
renderRepos();
const sig = Object.entries(wtState).map(([k, v]) => `${k}:${v.ready}`).join(";")
+ "|" + services.filter(s => s.wt).map(s => s.id + ":" + s.status).sort().join(",");
if (sig !== refresh._wtsig) { refresh._wtsig = sig; loadProfiles(); }
loadOrphans();
}

function svcUpUrl(id) {
const [p, n] = id.split("/");
return p ? `/api/services/wt/${encodeURIComponent(p)}/${encodeURIComponent(n)}/up` : `/api/services/${encodeURIComponent(id)}/up`;
}
function svcDownUrl(id) {
const [p, n] = id.split("/");
return p ? `/api/services/wt/${encodeURIComponent(p)}/${encodeURIComponent(n)}/down` : `/api/services/${encodeURIComponent(id)}/down`;
}
function logUrl(id) {
const [p, n] = id.split("/");
return p ? `/api/logs/wt/${encodeURIComponent(p)}/${encodeURIComponent(n)}` : `/api/logs/${encodeURIComponent(id)}`;
}

function renderRepos() {
$("#repos").innerHTML = repos.map(r => r.error
? `<div class="row"><span class="name">${esc(r.name)}</span><span class="badge">error</span><span>${esc(r.error)}</span></div>`
: `<div class="row" data-repo="${esc(r.name)}">
<span class="name">${esc(r.name)}</span>
${r.dirty ? '<span class="badge dirty">dirty</span>' : ""}
<select data-sel onchange="checkout(this)">
${r.branches.map(b => `<option value="${esc(b)}" ${b === r.current ? "selected" : ""}>${esc(b)}</option>`).join("")}
</select>
<span class="badge">${esc(r.current || "detached")}</span>
<span style="flex:1"></span>
<button class="danger" onclick="removeRepo('${esc(r.name)}')" title="quitar de la config (bloqueo si tiene servicios o perfiles usandolo)">✕ quitar</button>
</div>`).join("");
}

async function checkout(sel) {
const name = sel.closest(".row").dataset.repo;
const branch = sel.value;
try {
const res = await api("/api/checkout", { method:"POST", headers:{"Content-Type":"application/json"},
body: JSON.stringify({ items:[{ repo:name, branch }] }) });
for (const it of res) toast(`${it.repo}: ${it.ok ? "→ " + it.branch : it.error}`, !it.ok);
} catch (e) { toast(e.message, true); }
setTimeout(refresh, 1500);
}

async function svcUp(id, force) {
try {
const r = await api(`${svcUpUrl(id)}?force=${!!force}`, { method:"POST" });
toast(`${id}: ${r.msg || r.warn || (r.error ? r.msg : "ok")}`, !!r.error);
} catch (e) { toast(e.message, true); }
setTimeout(refresh, 800);
}
async function svcDown(id) {
try { const r = await api(svcDownUrl(id), { method:"POST" }); toast(`${id}: ${r.msg}`); }
catch (e) { toast(e.message, true); }
setTimeout(refresh, 800);
}
const profileSvcOrder = {};
async function wtToggle(profile) {
let order = profileSvcOrder[profile];
if (!order) {
try { order = (await api(`/api/profiles/${encodeURIComponent(profile)}`)).services?.services || []; }
catch { order = []; }
profileSvcOrder[profile] = order;
}
let rows = services.filter(s => s.wt && s.profile === profile);
rows = rows.sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name));
const anyRunning = rows.some(s => ["up", "starting"].includes(s.status));
if (anyRunning) {
for (const s of [...rows].reverse()) await svcDown(s.id);
} else {
for (const s of rows) await svcUp(s.id, true);
}
}
async function svcRestart(id) {
try { await api(svcDownUrl(id), { method: "POST" }); } catch (e) { toast(e.message, true); }
setTimeout(() => svcUp(id, true), 1200);
}
async function wtOpen(profile) {
try {
const r = await api(`/api/worktrees/${encodeURIComponent(profile)}/open`, { method: "POST" });
toast(`VS Code: ${r.opened.length} carpeta(s) abiertas (new window)`);
} catch (e) { toast(e.message, true); }
}

async function wtRemove(profile) {
if (!confirm(`¿Borrar el worktree "${profile}"? (se eliminan sus directorios y se bajan sus servicios)`)) return;
try {
const r = await api(`/api/worktrees/${encodeURIComponent(profile)}`, { method: "DELETE" });
toast(`worktree ${profile} eliminado` + (r.errors && r.errors.length ? " (aviso: " + r.errors.join("; ") + ")" : ""), r.errors && r.errors.length);
} catch (e) { toast(e.message, true); }
setTimeout(refresh, 800);
}

let editingProfile = null;
let formSvcOrder = [];
let formSvcSelected = new Set();

function allServiceNames() { return services.map(s => s.name); }

async function loadOrphans() {
let orph = [];
try { orph = await api("/api/worktrees/orphans"); } catch {}
const el = $("#orphans");
if (!orph.length) { el.style.display = "none"; return; }
el.style.display = "block";
el.innerHTML = '<div class="row" style="gap:10px;align-items:center;margin-bottom:6px">'
+ '<span class="name" style="color:var(--dim)">Worktrees sin perfil (creados fuera de devws):</span></div>'
+ orph.map(o => `<div class="row" style="gap:10px;align-items:center">
<span class="name" style="font-family:monospace">${esc(o.dir)}</span>
<span class="port">rama ${esc(o.branch || "?")}</span>
${o.dirty ? '<span class="badge dirty">dirty</span>' : ""}
<span style="flex:1"></span>
<button onclick="adoptOrphan('${esc(o.dir)}')">Adoptar (crear perfil ${esc(o.profile)})</button>
<button class="danger" onclick="removeOrphan('${esc(o.dir)}')">✕ eliminar worktree</button>
</div>`).join("");
}

async function adoptOrphan(dir) {
try {
const r = await api(`/api/worktrees/orphans/${encodeURIComponent(dir)}/adopt`, { method: "POST" });
toast(`worktree adoptado: perfil "${r.profile}" en slot ${r.slot}`);
refresh(); loadProfiles(); loadOrphans();
} catch (e) { toast(e.message, true); }
}

async function removeOrphan(dir) {
const [prof, rname] = dir.split(/__(?=[^_]+$)/);
if (!confirm(`¿Borrar el worktree "${dir}"? (git worktree remove --force en ${rname})`)) return;
try {
await api(`/api/worktrees/orphans/${encodeURIComponent(dir)}/remove`, { method: "POST" });
toast(`worktree ${dir} eliminado`); loadOrphans();
} catch (e) { toast(e.message, true); }
}

function profileCard(p) {
const svcNames = (p.services && p.services.services) || allServiceNames();
const wt = p.worktree && p.worktree !== "false";
const wts = wtState[p.name];
const runningSvc = n => services.find(s => (s.wt ? s.profile === p.name : activeProfile === p.name) && s.name === n);
const anyRunning = svcNames.some(n => { const st = runningSvc(n); return st && ["up", "starting"].includes(st.status); });
const otherRunning = [...new Set(services.filter(s => s.wt && s.profile !== p.name && ["up", "starting"].includes(s.status)).map(s => s.profile))];
const blocked = otherRunning.length > 0;
const svcRows = svcNames.map(n => {
const st = runningSvc(n);
const def = services.find(x => x.name === n);
const repo = st ? st.repo : (def || {}).repo;
const port = st ? st.port : (def || {}).port;
const branch = wt ? (p.repos || {})[repo] : (repos.find(r => r.name === repo) || {}).current;
const status = st ? st.status : "down";
const cls = status === "up" ? "up" : status === "starting" ? "starting" : "down";
return `<div class="p-svc">
<span class="pn" title="repo">${esc(repo || n)}${wt ? ' <span class="badge wt" title="corre en un git worktree aislado">wt</span>' : ""}</span>
<span style="flex:1;font-size:11px;font-family:monospace;color:var(--dim)" title="rama">${esc(branch || "—")}</span>
<span style="font-size:11px;white-space:nowrap" title="servicio">${esc(n)} :${port || "?"}</span>
<span class="badge ${cls}">${status}</span>
${st && status !== "down" ? `<button onclick="svcRestart('${esc(st.id)}')" title="baja y relanza este servicio">⟳ relanzar</button>` : ""}
</div>`;
}).join("");
let mainBtn;
if (!wt) mainBtn = `<button class="primary" ${blocked ? `disabled title="arrancado: ${otherRunning.join(", ")} — paralo primero"` : ""} onclick="applyProfile('${esc(p.name)}')">Cargar (legacy in-place)</button>`;
else if (!wts) mainBtn = `<button class="primary" onclick="applyProfile('${esc(p.name)}')">Crear worktree</button>`;
else if (!wts.ready) mainBtn = `<button disabled title="npm install / uv sync en curso">deps en curso…</button>`;
else if (anyRunning) mainBtn = `<button class="danger" onclick="wtToggle('${esc(p.name)}')">⏹ Parar</button>`;
else mainBtn = `<button class="primary" ${blocked ? `disabled title="arrancado: ${otherRunning.join(", ")} — paralo primero"` : ""} onclick="wtToggle('${esc(p.name)}')">▶ Arrancar</button>`;
const extraBtns = wt && wts ? `
<button onclick="wtOpen('${esc(p.name)}')" title="abre en VS Code todos los worktrees del perfil">📂 abrir en VS Code</button>
<button class="danger" onclick="wtRemove('${esc(p.name)}')" title="baja servicios y elimina los worktrees">✕ worktree</button>` : "";
return `<div class="p-card" ${blocked ? 'style="opacity:.55"' : ""}>
<h3>${esc(p.name)} ${wt ? '<span class="badge wt">worktree</span>' : ""} ${anyRunning ? '<span class="badge up">↑ arrancado</span>' : ""}</h3>
<div class="meta">creado: ${esc(p.created_at || "?")}</div>
<div class="p-svcs2">${svcRows || '<span class="badge">sin servicios</span>'}</div>
<div class="p-actions">
${mainBtn}
<button onclick="openLogs('${esc(p.name)}')">Ver logs</button>
<button onclick="openProfileForm('${esc(p.name)}')">Editar</button>
<button class="danger" onclick="deleteProfile('${esc(p.name)}')">Eliminar</button>
${extraBtns}
</div>
</div>`;
}

async function loadProfiles() {
const names = await api("/api/profiles");
const list = $("#profilesList");
if (!names.length) { list.innerHTML = '<span style="color:var(--dim)">Sin perfiles. Crea uno a la derecha.</span>'; return; }
const profs = await Promise.all(names.map(n => api(`/api/profiles/${encodeURIComponent(n)}`).catch(() => null)));
profs.forEach(p => { if (p) profileSvcOrder[p.name] = (p.services && p.services.services) || []; });
list.innerHTML = profs.filter(Boolean).map(p => profileCard(p)).join("");
}

function openProfileForm(name) {
editingProfile = name || null;
$("#profileForm").style.display = "block";
$("#formTitle").textContent = name ? `Editando perfil: ${name}` : "Nuevo perfil";
$("#pfName").value = name || "";
$("#pfName").disabled = !!name;
$("#pfWorktree").checked = false;
if (name) {
api(`/api/profiles/${encodeURIComponent(name)}`).then(p => {
renderFormRepos(p.repos || {});
const cur = (p.services && p.services.services) || allServiceNames();
formSvcOrder = [...cur, ...allServiceNames().filter(n => !cur.includes(n))];
formSvcSelected = new Set(cur);
renderFormServices();
$("#pfWorktree").checked = p.worktree === true;
});
} else {
renderFormRepos(Object.fromEntries(repos.filter(r => r.current).map(r => [r.name, r.current])));
formSvcOrder = [...enabledSet(), ...allServiceNames().filter(n => !enabledSet().has(n))];
formSvcSelected = new Set(enabledSet());
renderFormServices();
}
}

function pfSvcToggle(n, on) { on ? formSvcSelected.add(n) : formSvcSelected.delete(n); }

function pfSvcMove(idx, delta) {
const j = idx + delta;
if (j < 0 || j >= formSvcOrder.length) return;
const t = formSvcOrder[idx]; formSvcOrder[idx] = formSvcOrder[j]; formSvcOrder[j] = t;
renderFormServices();
}

function renderFormRepos(current) {
$("#pfRepos").innerHTML = repos.map(r => `
<div class="row" style="margin-top:6px">
<label>${esc(r.name)}</label>
<select data-pfrepo="${esc(r.name)}">
${(r.branches || []).map(b => `<option value="${esc(b)}" ${b === (current[r.name] || r.current) ? "selected" : ""}>${esc(b)}</option>`).join("")}
</select>
</div>`).join("");
}

function renderFormServices() {
$("#pfServices").innerHTML = "<div style='color:var(--dim);font-size:12px;margin-bottom:4px'>Servicios a levantar (el orden es el orden de arranque; desmarcar excluye):</div>" +
formSvcOrder.map((n, i) => {
const s = services.find(x => x.name === n) || { port: "?" };
return `
<div class="row" style="align-items:center;margin:2px 0">
<span style="width:22px;color:var(--dim)">${i + 1}.</span>
<input type="checkbox" data-pfsvc="${esc(n)}" ${formSvcSelected.has(n) ? "checked" : ""} onchange="pfSvcToggle('${esc(n)}', this.checked)">
<span style="font-size:13px">${esc(n)} <span style="color:var(--dim)">:${s.port}</span></span>
<span style="flex:1"></span>
<button onclick="pfSvcMove(${i}, -1)" ${i === 0 ? "disabled" : ""}>↑</button>
<button onclick="pfSvcMove(${i}, 1)" ${i === formSvcOrder.length - 1 ? "disabled" : ""}>↓</button>
</div>`;
}).join("");
}

function closeProfileForm() {
$("#profileForm").style.display = "none";
editingProfile = null;
}

function formPayload() {
const name = $("#pfName").value.trim() || (editingProfile || "");
const repos = {};
document.querySelectorAll("[data-pfrepo]").forEach(sel => repos[sel.dataset.pfrepo] = sel.value);
const svc = formSvcOrder.filter(n => formSvcSelected.has(n));
return { name, repos, services: svc, worktree: $("#pfWorktree").checked };
}

async function saveProfile() {
const p = formPayload();
if (!p.name) return toast("pon un nombre al perfil", true);
const method = editingProfile ? "PUT" : "POST";
try {
await api("/api/profiles", { method, headers: { "Content-Type": "application/json" },
body: JSON.stringify(p) });
toast(`perfil "${p.name}" ${editingProfile ? "actualizado" : "guardado"}`);
profileSvcOrder[p.name] = p.services;
closeProfileForm(); loadProfiles();
} catch (e) { toast(e.message, true); }
}

async function deleteProfile(name) {
if (!confirm(`¿Eliminar el perfil "${name}"?`)) return;
if (wtState[name]) {
try { await api(`/api/worktrees/${encodeURIComponent(name)}`, { method: "DELETE" }); } catch (e) { toast("worktree: " + e.message, true); }
}
await api(`/api/profiles/${encodeURIComponent(name)}`, { method: "DELETE" });
toast(`perfil "${name}" eliminado`); loadProfiles();
}

let applying = false;
async function applyProfile(name) {
if (applying) return;
applying = true;
const btns = [...document.querySelectorAll('button[onclick*="applyProfile"]')];
btns.forEach(b => { b.disabled = true; if (!b.dataset.label) b.dataset.label = b.textContent; b.textContent = "Cargando…"; });
toast(`${name}: cargando perfil (checkout + arranque de servicios; puede tardar un par de minutos)…`);
let isWt = false;
try {
const r = await api(`/api/profiles/${encodeURIComponent(name)}/apply`, { method: "POST" });
isWt = !!r.worktree;
for (const it of r.checkout) toast(`${it.repo}: ${it.ok ? "→ " + it.branch : it.error}`, !it.ok);
for (const [n, u] of r.services)
toast(`${n}: ${u.msg || u.warn || (u.error === "port_conflict" ? "conflicto de puerto" : "ok")}`, !u.ok);
if (r.msg) toast(`${name}: ${r.msg}`);
} catch (e) { toast(e.message, true); }
btns.forEach(b => { b.disabled = false; if (b.dataset.label) { b.textContent = b.dataset.label; delete b.dataset.label; } });
applying = false;
refresh();
if (isWt) setTimeout(refresh, 3000);
}

function newProfile() { openProfileForm(null); }

function openRepoForm() { $("#repoForm").style.display = "block"; $("#repoName").focus(); }
function closeRepoForm() { $("#repoForm").style.display = "none"; $("#repoName").value = ""; $("#repoPath").value = ""; }
async function saveRepo() {
const name = $("#repoName").value.trim();
const path = $("#repoPath").value.trim();
const kind = $("#repoKind").value;
if (!name || !path) return toast("falta nombre o path", true);
try {
await api("/api/repos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, path, kind }) });
toast(`repo "${name}" añadido a la config: entrará en los perfiles al crearlos o Editar`);
closeRepoForm(); refresh();
} catch (e) { toast(e.message, true); }
}
async function removeRepo(name) {
if (!confirm(`¿Quitar el repo "${name}" de la config?`)) return;
try {
await api(`/api/repos/${encodeURIComponent(name)}`, { method: "DELETE" });
toast(`repo "${name}" quitado de la config`);
refresh();
} catch (e) { toast(e.message, true); }
}

let modalTimer = null;
let modalSvc = null;
let modalProfile = null;
let modalServices = [];
let allLogsOn = false;

function openLogs(profileName) {
api(`/api/profiles/${encodeURIComponent(profileName)}`).then(p => {
modalProfile = profileName;
const isWt = p.worktree === true && wtState[profileName];
modalServices = isWt
? services.filter(s => s.wt && s.profile === profileName).map(s => s.id)
: ((p.services && p.services.services) || allServiceNames());
renderLogTabs();
$("#logModal").style.display = "flex";
$("#logModalTitle").textContent = `Logs · perfil ${profileName}${isWt ? " (worktree)" : ""}`;
selectLogTab(modalServices[0]);
});
}

function openAllLogs() {
allLogsOn = true;
renderLogTabs();
renderAllPanels();
$("#logModal").classList.add("full");
$("#logModal").style.display = "flex";
$("#logModalTitle").textContent = "Logs · todos los servicios";
$("#logTabs").style.display = "none";
$("#modalLog").style.display = "none";
$("#allGrid").style.display = "grid";
pollAllLogs();
}

function allPanelId(s) { return "all-" + s.id.replace(/[^a-zA-Z0-9_-]/g, "_"); }

function renderAllPanels() {
$("#allGrid").innerHTML = services.filter(s => s.wt).map(s => {
const cls = s.status === "up" ? "up" : (s.status === "starting" ? "starting" : "down");
const label = s.wt ? `${s.profile}/${s.name}` : s.name;
return `<div class="all-panel">
<div class="ph">${esc(label)} · :${s.port} <span class="st ${cls}">${esc(s.status)}</span></div>
<pre id="${allPanelId(s)}" data-svc="${esc(s.id)}"></pre>
</div>`;
}).join("");
}

async function pollAllLogs() {
clearInterval(modalTimer);
let first = true;
const tick = async () => {
try {
const r = await api("/api/logs/tail?lines=200");
const bySvc = {};
(Array.isArray(r) ? r : []).forEach(e => { (bySvc[e.svc] = bySvc[e.svc] || []).push(e.line); });
services.forEach(s => {
const el = document.getElementById(allPanelId(s));
if (!el) return;
el.innerHTML = colorizeLog(bySvc[s.id] || []) || "(sin salida aún)";
stickyScroll(el, first);
});
first = false;
} catch {}
};
tick();
modalTimer = setInterval(tick, 2500);
}

function renderLogTabs() {
if (allLogsOn) return;
$("#logTabs").innerHTML = modalServices.map(n => {
const st = services.find(s => s.name === n);
const cls = [modalSvc === n ? "active" : "", st && (st.status === "up" || st.status === "starting") ? "" : "muted"].join(" ");
return `<button class="${cls}" onclick="selectLogTab('${esc(n)}')">${esc(n)}${st ? " · :" + st.port : ""}</button>`;
}).join("") + `<button class="${modalSvc === "__all" ? "active" : ""}" onclick="selectLogTab('__all')">⧉ Todos</button>`;
}

function selectLogTab(name) {
if (name !== "__all") { _stick.set($("#modalLog"), true); }
if (name === "__all") {
allLogsOn = true;
renderAllPanels();
$("#logModal").classList.add("full");
$("#logTabs").style.display = "none";
$("#modalLog").style.display = "none";
$("#allGrid").style.display = "grid";
pollAllLogs();
return;
}
if (allLogsOn) {
allLogsOn = false;
$("#logModal").classList.remove("full");
$("#logTabs").style.display = "";
$("#modalLog").style.display = "";
$("#allGrid").style.display = "none";
}
modalSvc = name;
renderLogTabs();
$("#modalLog").textContent = "cargando...";
pollModalLog();
}

async function pollModalLog() {
clearInterval(modalTimer);
const tick = async () => {
try {
const r = await api(`${logUrl(modalSvc)}?lines=200`);
const el = $("#modalLog");
el.innerHTML = colorizeLog(r.lines) || "(sin salida aún)";
stickyScroll(el, false);
} catch {}
};
tick();
modalTimer = setInterval(tick, 2500);
}

function closeLogs() {
clearInterval(modalTimer); modalTimer = null;
allLogsOn = false;
$("#logModal").classList.remove("full");
$("#logModal").style.display = "none";
$("#logTabs").style.display = "";
$("#modalLog").style.display = "";
$("#allGrid").style.display = "none";
}

(async function init() {
await refresh();
loadProfiles();
setInterval(refresh, 5000);
})();
</script>
</body>
</html>
